[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leitor-curriculos"
version = "0.1.0"
description = "Backend pessoal para currículos, vagas e candidaturas assistidas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "playwright>=1.55,<2",
    "beautifulsoup4>=4.13,<5",
    "starlette>=1.10,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

